<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Panel | HervisHuber</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: "#111111",
                            white: "#FFFFFF",
                            lightgray: "#F5F5F5",
                            darkgray: "#404040",
                            green: "#16A34A"
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        'xl': '12px',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F5F5; color: #111111; }
    </style>
</head>
<body class="selection:bg-brand-green selection:text-white h-screen flex overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-white h-full hidden md:flex flex-col border-r border-brand-lightgray shadow-sm z-10">
        <div class="p-6">
            <a href="index.html" class="text-xl font-bold tracking-tight text-brand-black flex items-center gap-2">
                <i data-lucide="navigation-2" class="w-6 h-6 text-brand-green"></i>
                HervisHuber
            </a>
        </div>
        
        <nav class="flex-1 mt-6">
            <ul class="space-y-1 px-4">
                <li>
                    <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 bg-brand-lightgray rounded-xl text-sm font-medium text-brand-black">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Panel
                    </a>
                </li>
                <li>
                    <a href="booking.html" class="flex items-center gap-3 px-3 py-2.5 hover:bg-brand-lightgray rounded-xl text-sm font-medium text-brand-darkgray transition-colors">
                        <i data-lucide="car" class="w-4 h-4"></i> Nuevo Viaje
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-brand-lightgray rounded-xl text-sm font-medium text-brand-darkgray transition-colors">
                        <i data-lucide="history" class="w-4 h-4"></i> Mis Viajes
                    </a>
                </li>
                <li>
                    <a href="#" class="flex items-center gap-3 px-3 py-2.5 hover:bg-brand-lightgray rounded-xl text-sm font-medium text-brand-darkgray transition-colors">
                        <i data-lucide="wallet" class="w-4 h-4"></i> Billetera
                    </a>
                </li>
            </ul>
        </nav>

        <div class="p-6 border-t border-brand-lightgray">
            <a href="index.html" class="flex items-center gap-3 text-sm font-medium text-brand-darkgray hover:text-brand-black transition-colors">
                <i data-lucide="log-out" class="w-4 h-4"></i> Salir
            </a>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-brand-lightgray">
        <!-- Top bar -->
        <header class="h-16 bg-white flex items-center justify-between px-8 border-b border-gray-200 shrink-0">
            <div class="hidden md:block">
                <h2 class="text-lg font-medium">Hola, Jorge</h2>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="flex flex-col items-end">
                    <span class="text-[10px] text-brand-darkgray font-medium uppercase tracking-wider">Balance</span>
                    <span class="text-sm font-medium">AED 2,450</span>
                </div>
                <div class="h-9 w-9 bg-brand-black text-white rounded-full flex items-center justify-center font-medium text-sm">
                    J
                </div>
            </div>
        </header>

        <!-- Dashboard Area -->
        <div class="flex-1 overflow-y-auto p-4 md:p-8">
            <div class="max-w-5xl mx-auto space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <a href="booking.html" class="bg-white p-6 rounded-2xl flex items-center justify-between group hover:shadow-subtle transition-shadow border border-gray-200">
                        <div>
                            <h3 class="text-lg font-medium mb-1">Pedir un viaje</h3>
                            <p class="text-brand-darkgray text-sm">Reserva ahora</p>
                        </div>
                        <i data-lucide="arrow-right" class="w-6 h-6 text-brand-black group-hover:translate-x-1 transition-transform"></i>
                    </a>
                    <a href="#" class="bg-brand-black text-white p-6 rounded-2xl flex items-center justify-between group hover:shadow-subtle transition-shadow">
                        <div>
                            <h3 class="text-lg font-medium mb-1">HervisHuber Empresas</h3>
                            <p class="text-gray-400 text-sm">Gestiona viajes corporativos</p>
                        </div>
                        <i data-lucide="briefcase" class="w-6 h-6 text-white group-hover:-translate-y-1 transition-transform"></i>
                    </a>
                </div>

                <div>
                    <h3 class="text-base font-medium mb-4 text-brand-darkgray">Actividad reciente</h3>
                    <div class="bg-white border border-gray-200 rounded-2xl overflow-hidden">
                        <div class="p-5 flex items-center justify-between border-b border-gray-100">
                            <div class="flex items-center gap-4">
                                <div class="h-10 w-10 bg-brand-lightgray rounded-full flex items-center justify-center">
                                    <i data-lucide="map-pin" class="w-5 h-5 text-brand-darkgray"></i>
                                </div>
                                <div>
                                    <h4 class="font-medium text-sm">Dubai Mall</h4>
                                    <p class="text-xs text-brand-darkgray">Hoy, 10:30 AM</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-medium text-sm">AED 45.00</p>
                            </div>
                        </div>

                        <div class="p-5 flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="h-10 w-10 bg-brand-lightgray rounded-full flex items-center justify-center">
                                    <i data-lucide="map-pin" class="w-5 h-5 text-brand-darkgray"></i>
                                </div>
                                <div>
                                    <h4 class="font-medium text-sm">Dubai Marina</h4>
                                    <p class="text-xs text-brand-darkgray">Ayer, 18:45 PM</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-medium text-sm">AED 85.00</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>

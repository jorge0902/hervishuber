<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reserva tu viaje | EliteLatam</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        uber: {
                            black: "#000000",
                            gray: "#F6F6F6",
                            darkgray: "#242424",
                            green: "#05A357"
                        },
                        accent: {
                            gold: "#E9C176"
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/styles.css"/>
</head>
<body class="bg-white text-uber-black font-sans h-screen overflow-hidden flex flex-col selection:bg-accent-gold selection:text-uber-black">
    <!-- Header White version -->
    <header class="w-full z-50 bg-white border-b border-gray-200" id="main-header">
        <div class="max-w-7xl mx-auto px-6 h-16 flex justify-between items-center">
            <div class="flex items-center gap-8">
                <a href="index.html" class="text-2xl font-bold tracking-tighter">EliteLatam</a>
                <nav class="hidden md:flex gap-6">
                    <a href="booking.html" class="text-sm font-bold text-uber-black border-b-2 border-uber-black pb-1">Viajar</a>
                    <a href="ride.html" class="text-sm font-medium text-gray-500 hover:text-uber-black transition-colors">Mapa en Vivo</a>
                </nav>
            </div>
            <div class="flex items-center gap-4">
                <div class="h-8 w-8 rounded-full bg-uber-gray flex items-center justify-center font-bold">
                    J
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Left Panel - Form -->
        <div class="w-full lg:w-[450px] xl:w-[500px] flex flex-col bg-white z-10 shadow-2xl relative">
            <div class="p-6 md:p-8 flex-1 overflow-y-auto custom-scrollbar" id="sliding-panel">
                <h1 class="text-3xl font-bold mb-8">Pedir un viaje</h1>
                
                <div class="space-y-4 mb-8">
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 w-2 h-2 bg-uber-black rounded-full z-10"></span>
                        <div class="absolute left-[19px] top-[24px] w-0.5 h-8 bg-gray-300 z-0"></div>
                        <input class="w-full pl-10 pr-4 py-3.5 bg-uber-gray border-none rounded-xl focus:ring-2 focus:ring-uber-black/20 text-sm font-medium transition-all" type="text" value="Dubai International Airport (DXB)"/>
                    </div>
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 w-2 h-2 border-2 border-uber-black z-10 bg-white"></span>
                        <input class="w-full pl-10 pr-4 py-3.5 bg-uber-gray border-none rounded-xl focus:ring-2 focus:ring-uber-black/20 text-sm font-medium transition-all" placeholder="¿A dónde vas?" type="text" autofocus/>
                    </div>
                </div>

                <h3 class="text-sm font-bold text-gray-500 uppercase tracking-widest mb-4">Opciones de vehículo</h3>
                
                <div class="space-y-3">
                    <!-- Option 1 -->
                    <div class="ride-option border-2 border-uber-black bg-uber-gray p-4 rounded-xl flex items-center justify-between cursor-pointer transition-all animate-fade-in" style="animation-delay: 0.1s">
                        <div class="flex items-center gap-4">
                            <img alt="Elite Sedan" class="w-16 h-10 object-contain drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFipZG0RfStXHlP-CxbDQdj7k-8rCDAHlIUYLGyC7U63a7ZZoRclvoFyeSoGw5NFxgcb65KHO-O0v-tAbOeADES7xw56C4741DMx6SBQqQQKkbWsoKrEq8qxWB1IyMdItdNtxqTcX3pqs7vQ4WPerj4IOrZg0UYqIg4gUOkgKUynvUmzM7tuMjqX8UpmlH6XOwKRU3TBFxqkCNW_yuSE6ncDQUg4GUO4-GQgVn5FJ_bfZkts0OYULK"/>
                            <div>
                                <div class="flex items-center gap-2">
                                    <h4 class="font-bold">Elite Black</h4>
                                    <span class="material-symbols-outlined text-sm">person</span>
                                    <span class="text-sm font-medium">3</span>
                                </div>
                                <p class="text-xs text-gray-500">2 min de distancia</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold">AED 150.00</p>
                        </div>
                    </div>

                    <!-- Option 2 -->
                    <div class="ride-option border-2 border-transparent hover:bg-uber-gray/50 p-4 rounded-xl flex items-center justify-between cursor-pointer transition-all animate-fade-in" style="animation-delay: 0.2s">
                        <div class="flex items-center gap-4">
                            <img alt="Elite SUV" class="w-16 h-10 object-contain drop-shadow-md" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWsjnd47EmZP8UkkrJH8T0KKV7nJFlx1YhCCLWFATnAGUih37DUkyLRJcwtodzVywqldf2Ak1iBY6Rh6_HylYg2vrSNqBcb4QP6ZfA8BDu0p_HTZgqqRMa24Z6soqgrRwOPFfm48EE92_1K1LcrkLF330XzOQL7Tf_OCBpEdLQj_uX9bHj_AxDjlzlpABqFXosjVQHKz6rS1zJh4SOWNh_yg50Gq-fZAqfLXr4O40OHtFqEmmaMtwc"/>
                            <div>
                                <div class="flex items-center gap-2">
                                    <h4 class="font-bold">Elite SUV</h4>
                                    <span class="material-symbols-outlined text-sm">person</span>
                                    <span class="text-sm font-medium">6</span>
                                </div>
                                <p class="text-xs text-gray-500">5 min de distancia</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold">AED 220.00</p>
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <button class="w-full bg-uber-black text-white py-4 rounded-xl font-bold text-lg hover:bg-uber-darkgray transition-all shadow-lg active:scale-[0.98]">
                        Confirmar Elite Black
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel - Map Area -->
        <div class="hidden lg:block flex-1 relative map-bg">
            <div class="absolute inset-0 bg-uber-black/5"></div>
            <!-- Mock route line -->
            <svg class="absolute inset-0 w-full h-full" style="pointer-events: none;">
                <path d="M 300 200 C 400 300, 500 150, 600 400" stroke="#000" stroke-width="4" fill="none" stroke-dasharray="8,8" class="opacity-50" />
            </svg>
            
            <div class="absolute top-[200px] left-[300px] -translate-x-1/2 -translate-y-1/2">
                <span class="absolute w-4 h-4 bg-uber-black rounded-full -translate-x-1/2 -translate-y-1/2"></span>
                <span class="absolute w-12 h-12 bg-uber-black/20 rounded-full -translate-x-1/2 -translate-y-1/2 animate-ping"></span>
            </div>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>

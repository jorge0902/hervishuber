<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reserva | HervisHuber</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: "#111111",
                            white: "#FFFFFF",
                            lightgray: "#F5F5F5",
                            darkgray: "#404040",
                            green: "#16A34A"
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        'xl': '12px',
                    },
                    boxShadow: {
                        'soft': '0 4px 40px -8px rgba(0, 0, 0, 0.08)',
                        'subtle': '0 2px 10px rgba(0, 0, 0, 0.03)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F5F5; color: #111111; }
        .hero-map-bg {
            background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=2074&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="selection:bg-brand-green selection:text-white h-screen overflow-hidden flex flex-col">
    <!-- Navbar -->
    <header class="w-full z-50 bg-white border-b border-brand-lightgray py-4">
        <div class="max-w-7xl mx-auto px-6 h-8 flex justify-between items-center">
            <a href="index.html" class="text-lg font-bold tracking-tight text-brand-black flex items-center gap-2">
                <i data-lucide="navigation-2" class="w-5 h-5 text-brand-green"></i>
                HervisHuber
            </a>
            <div class="flex items-center gap-4">
                <div class="h-8 w-8 rounded-full bg-brand-lightgray flex items-center justify-center font-bold text-sm">
                    J
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Left Panel - Form -->
        <div class="w-full lg:w-[450px] flex flex-col bg-white z-10 shadow-soft relative border-r border-brand-lightgray">
            <div class="p-8 flex-1 overflow-y-auto">
                <h1 class="text-2xl font-semibold mb-8">Pedir un viaje</h1>
                
                <div class="space-y-4 mb-8">
                    <div class="relative group">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 w-2 h-2 rounded-full bg-brand-black"></div>
                        <div class="absolute left-[19px] top-[24px] w-0.5 h-6 bg-brand-lightgray z-0"></div>
                        <input class="w-full pl-10 pr-4 py-3 bg-brand-lightgray border border-transparent rounded-xl focus:bg-white focus:border-brand-green focus:ring-0 text-sm font-medium transition-all outline-none" type="text" value="Aeropuerto Internacional de Dubái (DXB)"/>
                    </div>
                    <div class="relative group">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 w-2 h-2 bg-brand-green rounded-sm"></div>
                        <input class="w-full pl-10 pr-4 py-3 bg-brand-lightgray border border-transparent rounded-xl focus:bg-white focus:border-brand-green focus:ring-0 text-sm font-medium transition-all outline-none" placeholder="¿A dónde vas?" type="text" autofocus/>
                    </div>
                </div>

                <h3 class="text-xs font-semibold text-brand-darkgray uppercase tracking-widest mb-4">Opciones de vehículo</h3>
                
                <div class="space-y-3">
                    <div class="border-2 border-brand-black bg-brand-white p-4 rounded-xl flex items-center justify-between cursor-pointer transition-all">
                        <div class="flex items-center gap-4">
                            <i data-lucide="car" class="w-8 h-8 text-brand-black"></i>
                            <div>
                                <h4 class="font-medium text-sm">Business Sedan</h4>
                                <p class="text-xs text-brand-darkgray">~2 min de distancia</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-medium text-sm">AED 150</p>
                        </div>
                    </div>
                    <div class="border-2 border-transparent hover:bg-brand-lightgray p-4 rounded-xl flex items-center justify-between cursor-pointer transition-all">
                        <div class="flex items-center gap-4">
                            <i data-lucide="car-front" class="w-8 h-8 text-brand-darkgray"></i>
                            <div>
                                <h4 class="font-medium text-sm">Executive SUV</h4>
                                <p class="text-xs text-brand-darkgray">~5 min de distancia</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-medium text-sm">AED 220</p>
                        </div>
                    </div>
                </div>

                <div class="mt-8">
                    <button class="w-full bg-brand-green text-white py-4 rounded-xl font-medium hover:bg-[#15803D] transition-colors">
                        Confirmar Business Sedan
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Panel - Map Area -->
        <div class="hidden lg:block flex-1 relative hero-map-bg grayscale-[10%] opacity-80">
            <div class="absolute inset-0 bg-white/20"></div>
        </div>
    </main>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mapa en Vivo | HervisHuber</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- MapLibre GL JS -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: "#111111",
                            white: "#FFFFFF",
                            lightgray: "#F5F5F5",
                            darkgray: "#404040",
                            green: "#16A34A"
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        'xl': '12px',
                    },
                    boxShadow: {
                        'soft': '0 4px 40px -8px rgba(0, 0, 0, 0.08)',
                        'subtle': '0 2px 10px rgba(0, 0, 0, 0.03)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F5F5; color: #111111; }
        .maplibregl-popup-content {
            border-radius: 12px;
            padding: 0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="selection:bg-brand-green selection:text-white h-screen overflow-hidden">
    
    <!-- Map Container -->
    <div id="map" class="fixed inset-0 z-0"></div>

    <!-- Floating Top Bar -->
    <header class="fixed top-6 left-6 right-6 h-14 bg-white/90 backdrop-blur-md rounded-xl z-40 flex items-center justify-between px-6 border border-gray-200 shadow-subtle max-w-7xl mx-auto">
        <div class="flex items-center gap-4">
            <a href="index.html" class="hover:text-brand-darkgray transition-colors flex items-center gap-2 text-sm font-medium">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a Inicio
            </a>
            <span class="text-gray-300">|</span>
            <h1 class="text-sm font-semibold tracking-tight text-brand-black flex items-center gap-1.5">
                <i data-lucide="navigation-2" class="w-4 h-4 text-brand-green"></i>
                HervisHuber Real-Time
            </h1>
        </div>
        <a href="dashboard.html" class="h-8 w-8 rounded-full bg-brand-black text-white flex items-center justify-center font-medium text-xs">
            J
        </a>
    </header>

    <!-- Floating Bottom Panel -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white/95 backdrop-blur-md rounded-2xl z-40 p-6 border border-gray-200 shadow-soft">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h3 class="text-sm font-semibold text-brand-black">Conductor activo</h3>
                <p id="selected-driver-info" class="text-xs text-brand-darkgray">Ahmed • Toyota Camry</p>
            </div>
            <div class="text-right">
                <span class="text-sm font-bold text-brand-green">3 min</span>
            </div>
        </div>
        <div class="w-full bg-brand-lightgray h-1.5 rounded-full overflow-hidden">
            <div class="bg-brand-black w-2/3 h-full animate-pulse"></div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>

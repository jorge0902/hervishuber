<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Mapa en Vivo | HervisHuber</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            black: "#111111",
                            white: "#FFFFFF",
                            lightgray: "#F5F5F5",
                            darkgray: "#404040",
                            green: "#16A34A"
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    borderRadius: {
                        'xl': '12px',
                    },
                    boxShadow: {
                        'soft': '0 4px 40px -8px rgba(0, 0, 0, 0.08)',
                        'subtle': '0 2px 10px rgba(0, 0, 0, 0.03)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F5F5F5; color: #111111; }
        .hero-map-bg {
            background-image: url('https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=2074&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="selection:bg-brand-green selection:text-white h-screen overflow-hidden">
    <!-- Map Background -->
    <div class="fixed inset-0 hero-map-bg z-0 grayscale-[10%] opacity-80">
        <div class="absolute inset-0 bg-white/20"></div>
    </div>

    <!-- Floating Top Bar -->
    <header class="fixed top-6 left-6 right-6 h-14 bg-white/90 backdrop-blur-md rounded-xl z-40 flex items-center justify-between px-6 border border-gray-200 shadow-subtle max-w-7xl mx-auto">
        <div class="flex items-center gap-4">
            <a href="index.html" class="hover:text-brand-darkgray transition-colors">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
            </a>
            <h1 class="text-base font-semibold tracking-tight">HervisHuber</h1>
        </div>
        <a href="dashboard.html" class="h-8 w-8 rounded-full bg-brand-lightgray flex items-center justify-center font-medium text-sm">
            J
        </a>
    </header>

    <!-- Floating Bottom Panel (Linear style) -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-white rounded-2xl z-40 p-6 border border-gray-200 shadow-soft">
        <div class="flex items-center justify-between mb-4">
            <div>
                <h3 class="text-sm font-semibold">Tu conductor está en camino</h3>
                <p class="text-xs text-brand-darkgray">Carlos M. - Lexus ES (Blanco)</p>
            </div>
            <div class="text-right">
                <span class="text-lg font-bold text-brand-green">4 min</span>
            </div>
        </div>
        <div class="w-full bg-brand-lightgray h-1.5 rounded-full overflow-hidden">
            <div class="bg-brand-black w-1/3 h-full"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
